name: Regenerate SAT POI Dashboard

on:
  schedule:
    # Körs varje dag kl 04:17 UTC (06:17 svensk sommartid)
    - cron: "17 4 * * *"
  workflow_dispatch:  # Tillåter manuell körning från GitHub UI

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generera dashboard + TODO-lista
        env:
          SKIP_IMAGE_FETCH: "1"
        run: |
          python3 fetch_postpass_data.py
          python3 convert_osm_raw_candidates.py
          python3 generate_poi_dashboard.py
          python3 generate_todo_list.py
          python3 generate_poi_quality_history.py

      - name: Commita om filen ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sat_poi_dashboard.html sat_todo_list.html sat_poi_quality_history.json sat_poi_quality_history_data.js sat_poi_quality_history.html osm_postpass_data.json osm_candidates.json
          if git diff --cached --quiet; then
            echo "Ingen förändring – hoppar över commit"
          else
            git commit -m "Auto-regenerate dashboard $(date -u +%Y%m%d\ %H:%M) UTC"
            git fetch origin main
            git merge origin/main -X ours --no-edit
            git push
          fi
