name: Refresh Evergreen identity findings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evergreen-findings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate read-only findings and public report
        run: python3 generate_evergreen_report.py

      - name: Publish the new findings snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evergreen_findings.json evergreen_report.html
          if git diff --cached --quiet; then
            echo "No findings snapshot changes to publish."
          else
            git commit -m "Refresh Evergreen findings $(date -u +%Y-%m-%d)"
            git push
          fi
