<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT POI Historia</title>
<script src="sat_poi_quality_history_data.js"></script>
<style>
  body { font-family: system-ui,sans-serif; margin:0; padding:0; background:#f5f5f5; color:#222; }
  header { background:#2a6496; color:#fff; padding:1rem 1.5rem; }
  header h1 { margin:0 0 .25rem; font-size:1.3rem; }
  header p  { margin:0; font-size:.85rem; opacity:.85; }
  .container { max-width:960px; margin:1.5rem auto; padding:0 1rem; }
  .search-box { display:flex; gap:.5rem; margin-bottom:1.5rem; }
  .search-box input { flex:1; padding:.6rem .9rem; border:1px solid #ccc; border-radius:6px; font-size:1rem; }
  .search-box button { padding:.6rem 1.2rem; background:#2a6496; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  .result-list { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.1); overflow:hidden; }
  .result-item { padding:.75rem 1rem; border-bottom:1px solid #eee; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .result-item:last-child { border-bottom:none; }
  .result-item:hover { background:#f0f7ff; }
  .result-item .name { font-weight:600; }
  .result-item .meta { font-size:.8rem; color:#666; }
  .poi-detail { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.1); padding:1.5rem; margin-top:1.5rem; }
  .poi-detail h2 { margin:0 0 .25rem; color:#2a6496; }
  .poi-detail .subtitle { font-size:.85rem; color:#666; margin-bottom:1.5rem; }
  table.timeline { width:100%; border-collapse:collapse; font-size:.88rem; }
  table.timeline th { background:#f0f0f0; padding:.5rem .75rem; text-align:left; border-bottom:2px solid #ddd; }
  table.timeline td { padding:.45rem .75rem; border-bottom:1px solid #eee; }
  table.timeline tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; width:1.4rem; height:1.4rem; line-height:1.4rem; text-align:center; border-radius:50%; font-size:.8rem; font-weight:700; }
  .badge-yes { background:#d4edda; color:#155724; }
  .badge-no  { background:#f8d7da; color:#721c24; }
  .badge-new { background:#fff3cd; color:#856404; font-size:.65rem; }
  .delta { font-size:.7rem; color:#28a745; font-weight:700; margin-left:.3rem; }
  .delta.lost { color:#dc3545; }
  .osm-link { color:#2a6496; text-decoration:none; font-size:.8rem; }
  .osm-link:hover { text-decoration:underline; }
  .no-result { text-align:center; color:#999; padding:2rem; }
  .stats-bar { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem; }
  .stat-chip { background:#e8f4fd; border:1px solid #bee3f8; border-radius:20px; padding:.3rem .8rem; font-size:.82rem; }
</style>
</head>
<body>
<header>
  <h1>🗺️ SAT POI Historia — per objekt</h1>
  <p>Sök en POI och se hur dess datakvalitet förändrats mellan versioner</p>
</header>
<div class="container">
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="Sök POI namn eller sektion…" autocomplete="off">
    <button onclick="doSearch()">Sök</button>
  </div>
  <div id="results"></div>
  <div id="detail"></div>
</div>
<script>
const DATA = window.SAT_POI_QUALITY_HISTORY;
const versions = DATA.versions;

// Build index: id → [{version, snap}]
const poiIndex = {};
versions.forEach(v => {
  (v.poiSnapshots || []).forEach(s => {
    if (!poiIndex[s.id]) poiIndex[s.id] = [];
    poiIndex[s.id].push({ version: v.version, capturedAt: v.capturedAt, snap: s });
  });
});

// Latest snapshot per POI → for search
const latest = {};
Object.entries(poiIndex).forEach(([id, entries]) => {
  latest[id] = entries[entries.length - 1].snap;
});

const FIELDS = ['osm','wikidata','image','website','wheelchair','opening_hours','fee','description'];
const FIELD_LABELS = {
  osm: 'OSM-länk', wikidata: 'Wikidata', image: 'Bild',
  website: 'Hemsida', wheelchair: 'Tillgänglighet', opening_hours: 'Öppettider',
  fee: 'Avgift', description: 'Beskrivning'
};

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('detail').innerHTML = '';
  if (!q) { document.getElementById('results').innerHTML = ''; return; }

  const hits = Object.values(latest).filter(s =>
    (s.name || '').toLowerCase().includes(q) ||
    (s.section || '').toLowerCase().includes(q) ||
    (s.id || '').toLowerCase().includes(q)
  ).slice(0, 30);

  if (!hits.length) {
    document.getElementById('results').innerHTML = '<div class="no-result">Inga POIs hittades</div>';
    return;
  }

  const html = '<div class="result-list">' +
    hits.map(s => `
      <div class="result-item" onclick="showDetail('${s.id.replace(/'/g,"\\'")}')">
        <div><span class="name">${s.name}</span></div>
        <div class="meta">${s.section} · ${s.category}</div>
      </div>`).join('') +
    '</div>';
  document.getElementById('results').innerHTML = html;
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function badge(val, prev) {
  const icon = val ? '✓' : '✗';
  const cls  = val ? 'badge-yes' : 'badge-no';
  let delta = '';
  if (prev !== undefined && prev !== val) {
    delta = val
      ? `<span class="delta">▲ ny</span>`
      : `<span class="delta lost">▼ förlorad</span>`;
  }
  return `<span class="badge ${cls}">${icon}</span>${delta}`;
}

function showDetail(id) {
  document.getElementById('results').innerHTML = '';
  const history = poiIndex[id];
  if (!history || !history.length) {
    document.getElementById('detail').innerHTML = '<p>Ingen historik hittad.</p>';
    return;
  }

  const snap = history[history.length - 1].snap;
  const osmLink = snap.lat
    ? `<a class="osm-link" href="https://www.openstreetmap.org/?mlat=${snap.lat}&mlon=${snap.lon}#map=17/${snap.lat}/${snap.lon}" target="_blank">🗺 Visa på OSM</a>`
    : '';

  // Summary chips
  const score = FIELDS.filter(f => snap[f]).length;
  const chips = `<div class="stats-bar">
    <span class="stat-chip">Senaste version: ${history[history.length-1].version}</span>
    <span class="stat-chip">Sektion: ${snap.section}</span>
    <span class="stat-chip">Kategori: ${snap.category}</span>
    <span class="stat-chip">Fält ifyllda: ${score}/${FIELDS.length}</span>
    ${osmLink}
  </div>`;

  // Timeline table — columns = versions
  let thead = '<tr><th>Fält</th>';
  history.forEach(h => {
    const d = h.capturedAt ? h.capturedAt.slice(0,10) : `v${h.version}`;
    thead += `<th>v${h.version}<br><small>${d}</small></th>`;
  });
  thead += '</tr>';

  let tbody = '';
  FIELDS.forEach(field => {
    let row = `<tr><td><strong>${FIELD_LABELS[field]}</strong></td>`;
    history.forEach((h, idx) => {
      const val  = h.snap[field];
      const prev = idx > 0 ? history[idx-1].snap[field] : undefined;
      row += `<td style="text-align:center">${badge(val, prev)}</td>`;
    });
    row += '</tr>';
    tbody += row;
  });

  document.getElementById('detail').innerHTML = `
    <div class="poi-detail">
      <h2>${snap.name}</h2>
      <div class="subtitle">ID: ${id}</div>
      ${chips}
      <table class="timeline">
        <thead>${thead}</thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
